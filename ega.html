<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>AfrONet 2026 EGA — Official Ballot</title>
    <link rel="canonical" href="https://afronet.bio/ega" />
    <!-- i18n:alternates --><!-- /i18n:alternates -->
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/favicons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicons/favicon-16x16.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #1a9120;
            --green-dark: #07370a;
            --green-soft: #eef6ed;
            --gold: #f4c430;
            --text: #3f4a3f;
            --muted: #626f62;
            --line: #dfe7de;
            --bg: #f6f7f2;
            --white: #fff;
            --red: #b42318;
            --red-soft: #fdecea;
            --amber: #8a5a00;
            --amber-soft: #fff6dc;
            --radius: 14px;
            --heading: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--body);
            font-size: 16px;
            line-height: 1.6;
        }
        a { color: var(--green); }
        h1, h2, h3, legend { font-family: var(--heading); color: var(--green-dark); }
        :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
        [hidden] { display: none !important; }
        .wrap { width: 100%; max-width: 820px; margin: 0 auto; padding: 0 16px; }

        /* Header */
        .ega-top { background: var(--white); border-bottom: 4px solid var(--gold); }
        .ega-top__bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; }
        .ega-top__logo img { display: block; height: 44px; width: auto; }
        .ega-lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--bg); }
        .ega-lang button {
            min-width: 48px; min-height: 40px; padding: 0 14px; border: 0; border-radius: 999px;
            background: transparent; color: var(--green-dark); font: 700 14px var(--body); cursor: pointer;
        }
        .ega-lang button[aria-pressed="true"] { background: var(--green); color: #fff; }
        .ega-hero { background: var(--green-dark); color: #fff; padding: 26px 0 28px; }
        .ega-hero__eyebrow { margin: 0 0 6px; color: var(--gold); font-size: 12.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
        .ega-hero h1 { margin: 0; color: #fff; font-size: clamp(22px, 5vw, 30px); line-height: 1.25; }
        .ega-hero__sub { margin: 6px 0 0; color: rgba(255, 255, 255, 0.82); font-size: clamp(16px, 3.6vw, 19px); font-weight: 500; }

        main { padding: 22px 0 40px; }

        /* Status banner */
        .ega-status {
            margin-bottom: 20px; padding: 18px 20px; border-radius: var(--radius);
            border: 1px solid var(--line); border-left: 6px solid var(--green); background: var(--white);
        }
        .ega-status--not-open { border-left-color: var(--gold); }
        .ega-status--closed, .ega-status--error { border-left-color: var(--red); }
        .ega-status__title { margin: 0 0 4px; font-family: var(--heading); font-size: 19px; font-weight: 800; color: var(--green-dark); }
        .ega-status__line { margin: 0; color: var(--text); }
        .ega-status__line strong { color: var(--green-dark); }
        .ega-count { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; max-width: 340px; margin-top: 12px; }
        .ega-count__box { min-width: 0; padding: 8px 4px; border-radius: 10px; background: var(--green-soft); text-align: center; }
        .ega-count__num { display: block; font-family: var(--heading); font-size: 22px; font-weight: 800; line-height: 1.1; color: var(--green-dark); font-variant-numeric: tabular-nums; }
        .ega-count__label { display: block; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .ega-count__caption { grid-column: 1 / -1; margin: 0 0 -2px; font-size: 13px; font-weight: 600; color: var(--muted); }

        /* Steps */
        .ega-steps { display: flex; gap: 6px; margin: 0 0 18px; padding: 0; list-style: none; counter-reset: s; }
        .ega-steps li {
            flex: 1 1 0; padding: 8px 6px; border-radius: 10px; background: #e7ece6; color: var(--muted);
            font-size: 12.5px; font-weight: 600; text-align: center; line-height: 1.3;
        }
        .ega-steps li.is-current { background: var(--green); color: #fff; }
        .ega-steps li.is-done { background: var(--green-soft); color: var(--green-dark); }

        /* Cards */
        .ega-card { margin-bottom: 18px; padding: 22px 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--white); }
        .ega-card h2 { margin: 0 0 4px; font-size: 21px; }
        .ega-card__intro { margin: 0 0 16px; color: var(--muted); font-size: 15px; }
        .ega-field { margin-bottom: 14px; }
        .ega-field label, .ega-label { display: block; margin-bottom: 5px; color: var(--green-dark); font-weight: 600; font-size: 15px; }
        .ega-field .req { color: var(--red); }
        input[type="text"], input[type="email"], select, textarea {
            width: 100%; min-height: 48px; padding: 10px 12px; border: 1.5px solid #c9d4c8; border-radius: 10px;
            background: #fff; color: var(--text); font: 16px var(--body);
        }
        textarea { min-height: 110px; resize: vertical; }
        input:focus, select:focus, textarea:focus { border-color: var(--green); outline: none; box-shadow: 0 0 0 3px rgba(26, 145, 32, 0.2); }
        .is-invalid { border-color: var(--red) !important; box-shadow: 0 0 0 3px rgba(180, 35, 24, 0.15) !important; }
        .ega-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
        .ega-code { display: flex; gap: 10px; }
        .ega-code input { flex: 1 1 auto; font-family: ui-monospace, Consolas, monospace; font-size: 18px; letter-spacing: 1px; text-transform: uppercase; }
        .ega-verified {
            display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 12px; padding: 12px 14px;
            border-radius: 10px; background: var(--green-soft); color: var(--green-dark);
        }
        .ega-verified strong { font-family: var(--heading); font-size: 17px; }
        .ega-linkbtn { padding: 6px 2px; border: 0; background: none; color: var(--green); font: 600 14px var(--body); text-decoration: underline; cursor: pointer; }
        .ega-check {
            display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 1.5px solid #c9d4c8; border-radius: 10px;
            background: #fbfcfa; cursor: pointer; font-size: 15px;
        }
        .ega-check input { flex: 0 0 auto; width: 24px; height: 24px; margin-top: 2px; accent-color: var(--green); }

        /* Buttons */
        .ega-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px;
            border: 2px solid var(--green); border-radius: 10px; background: var(--green); color: #fff;
            font: 700 16px var(--body); text-decoration: none; cursor: pointer;
        }
        .ega-btn:hover { background: #157a1a; border-color: #157a1a; }
        .ega-btn--outline { background: #fff; color: var(--green); }
        .ega-btn--outline:hover { background: var(--green-soft); color: var(--green-dark); }
        .ega-btn--block { width: 100%; }
        .ega-btn[disabled] { opacity: 0.6; cursor: not-allowed; }
        .ega-spinner { width: 18px; height: 18px; border: 3px solid rgba(255, 255, 255, 0.45); border-top-color: #fff; border-radius: 50%; animation: ega-spin 0.8s linear infinite; }
        @keyframes ega-spin { to { transform: rotate(360deg); } }

        /* Messages */
        .ega-msg { margin: 12px 0 0; padding: 12px 14px; border-radius: 10px; font-size: 15px; }
        .ega-msg:empty { display: none; }
        .ega-msg--error { background: var(--red-soft); color: var(--red); }
        .ega-msg--warn { background: var(--amber-soft); color: var(--amber); }
        .ega-errors { margin: 0 0 16px; padding: 14px 16px; border: 1px solid #f3c1bc; border-radius: 10px; background: var(--red-soft); color: var(--red); }
        .ega-errors p { margin: 0 0 6px; font-weight: 700; }
        .ega-errors ul { margin: 0; padding-left: 20px; }
        .ega-errors a { color: var(--red); }

        /* Amendments */
        .ega-amend { min-width: 0; margin: 0 0 14px; padding: 18px 16px; border: 1.5px solid var(--line); border-radius: var(--radius); background: #fff; scroll-margin-top: 16px; }
        .ega-amend.is-answered { border-color: rgba(26, 145, 32, 0.45); }
        .ega-amend.is-invalid { border-color: var(--red); background: #fffafa; }
        .ega-amend legend { float: left; width: 100%; padding: 0; margin: 0 0 6px; font-size: 17.5px; font-weight: 800; line-height: 1.35; }
        .ega-amend legend + * { clear: both; }
        .ega-amend__id { display: inline-block; margin-right: 6px; padding: 1px 9px; border-radius: 999px; background: var(--green-dark); color: #fff; font-size: 13px; vertical-align: 2px; }
        .ega-amend__summary { margin: 0 0 10px; color: var(--muted); font-size: 14.5px; }
        .ega-amend__q { margin: 0 0 12px; color: var(--green-dark); font-weight: 600; font-size: 15px; }
        .ega-opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .ega-opt {
            position: relative; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 10px 12px;
            border: 2px solid #c9d4c8; border-radius: 10px; background: #fff; cursor: pointer; font-weight: 700; font-size: 15px; line-height: 1.25;
        }
        .ega-opt input { flex: 0 0 auto; width: 22px; height: 22px; margin: 0; accent-color: var(--green-dark); }
        .ega-opt:hover { border-color: #9fb59d; }
        .ega-opt--yes.is-checked { border-color: var(--green); background: #e9f6e8; color: #0f5e13; }
        .ega-opt--no.is-checked { border-color: var(--red); background: var(--red-soft); color: var(--red); }
        .ega-opt--abstain.is-checked { border-color: #6b7280; background: #f1f2f4; color: #374151; }
        .ega-opt:focus-within { outline: 3px solid var(--gold); outline-offset: 2px; }

        /* Progress (sticky at the bottom while voting) */
        .ega-progress {
            position: sticky; bottom: 0; z-index: 5; display: flex; align-items: center; gap: 12px; margin: 0 -4px 14px; padding: 10px 14px;
            border: 1px solid var(--line); border-radius: 12px; background: rgba(255, 255, 255, 0.96); box-shadow: 0 -4px 16px rgba(7, 55, 10, 0.08);
        }
        .ega-progress__text { flex: 0 0 auto; font-weight: 700; color: var(--green-dark); font-size: 14.5px; }
        .ega-progress__bar { flex: 1 1 auto; height: 10px; border-radius: 999px; background: #e3e9e2; overflow: hidden; }
        .ega-progress__fill { height: 100%; width: 0; background: var(--green); transition: width 0.25s ease; }
        .ega-counter { margin-top: 4px; color: var(--muted); font-size: 13px; text-align: right; }

        /* Review */
        .ega-table { width: 100%; border-collapse: collapse; font-size: 15px; }
        .ega-table th, .ega-table td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
        .ega-table th { color: var(--muted); font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.5px; }
        .ega-table td:first-child { white-space: nowrap; font-weight: 700; color: var(--green-dark); }
        .ega-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; }
        .ega-badge--YES { background: #e9f6e8; color: #0f5e13; }
        .ega-badge--NO { background: var(--red-soft); color: var(--red); }
        .ega-badge--ABSTAIN { background: #f1f2f4; color: #374151; }
        .ega-dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0 0 16px; font-size: 15px; }
        .ega-dl dt { color: var(--muted); }
        .ega-dl dd { margin: 0; color: var(--green-dark); font-weight: 600; word-break: break-word; }
        .ega-warning { margin: 16px 0; padding: 12px 14px; border-radius: 10px; background: var(--amber-soft); color: var(--amber); font-weight: 700; }
        .ega-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }

        /* Confirmation */
        .ega-done { text-align: center; }
        .ega-done__icon { display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; margin-bottom: 8px; border-radius: 50%; background: var(--green); color: #fff; font-size: 34px; font-weight: 800; }
        .ega-receipt { display: inline-block; margin: 10px 0 4px; padding: 10px 18px; border: 2px dashed var(--green); border-radius: 12px; font-family: ui-monospace, Consolas, monospace; font-size: 22px; font-weight: 700; color: var(--green-dark); letter-spacing: 1px; }
        .ega-done__text { max-width: 620px; margin: 14px auto 0; text-align: left; }
        .ega-done .ega-table { margin-top: 18px; text-align: left; }

        footer { padding: 22px 0 30px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13.5px; text-align: center; }
        footer p { margin: 2px 0; }

        @media (max-width: 600px) {
            .ega-row { grid-template-columns: 1fr; }
            .ega-opts { grid-template-columns: 1fr; }
            .ega-code { flex-direction: column; }
            .ega-steps li { font-size: 11.5px; padding: 7px 4px; }
            .ega-card { padding: 18px 14px; }
            .ega-table { font-size: 14px; }
            .ega-actions .ega-btn { width: 100%; }
            .ega-dl { grid-template-columns: 1fr; gap: 0; }
            .ega-dl dd { margin-bottom: 8px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
        }
        @media print {
            body { background: #fff; }
            .ega-top, .ega-hero, .ega-status, .ega-steps, footer, .no-print, #s-code, #s-form, #s-review { display: none !important; }
            .ega-card { border: 0; padding: 0; }
            main { padding: 0; }
        }
    </style>
</head>

<body>
    <header class="ega-top">
        <div class="wrap ega-top__bar">
            <a class="ega-top__logo" href="/" aria-label="AfrONet"><img src="/assets/images/logo-dark.png" alt="AfrONet — African Organic Network" width="155" height="44"></a>
            <div class="ega-lang" role="group" aria-label="Language / Langue">
                <button type="button" data-lang="en" aria-pressed="true" lang="en">EN</button>
                <button type="button" data-lang="fr" aria-pressed="false" lang="fr">FR</button>
            </div>
        </div>
    </header>
    <div class="ega-hero">
        <div class="wrap">
            <p class="ega-hero__eyebrow" data-t="eyebrow"></p>
            <h1 data-t="title"></h1>
            <p class="ega-hero__sub" data-t="subtitle"></p>
        </div>
    </div>

    <main class="wrap" id="main">
        <div class="ega-status" id="status" role="status" aria-live="polite">
            <p class="ega-status__title" data-t="loading"></p>
        </div>

        <ol class="ega-steps" id="steps" hidden>
            <li data-step="1"><span data-t="step1"></span></li>
            <li data-step="2"><span data-t="step2"></span></li>
            <li data-step="3"><span data-t="step3"></span></li>
            <li data-step="4"><span data-t="step4"></span></li>
        </ol>

        <!-- Step 1: voter code -->
        <section class="ega-card" id="s-code" hidden aria-labelledby="h-code">
            <h2 id="h-code" data-t="codeTitle"></h2>
            <p class="ega-card__intro" data-t="codeIntro"></p>
            <form id="code-form" novalidate>
                <label class="ega-label" for="code" data-t="codeLabel"></label>
                <div class="ega-code">
                    <input type="text" id="code" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" placeholder="EGA-XXXX-XXXX" aria-describedby="code-msg" required>
                    <button type="submit" class="ega-btn" id="verify-btn"><span data-t="verify"></span></button>
                </div>
                <div class="ega-msg ega-msg--error" id="code-msg" role="alert"></div>
            </form>
            <div class="ega-verified" id="verified" hidden>
                <span><span data-t="votingFor"></span> <strong id="verified-org"></strong></span>
                <button type="button" class="ega-linkbtn" id="change-code" data-t="changeCode"></button>
            </div>
        </section>

        <!-- Steps 2 and 3 -->
        <form id="s-form" novalidate hidden>
            <div class="ega-errors" id="form-errors" tabindex="-1" hidden></div>

            <section class="ega-card" aria-labelledby="h-auth">
                <h2 id="h-auth" data-t="authTitle"></h2>
                <p class="ega-card__intro" data-t="authIntro"></p>
                <div class="ega-field">
                    <label for="organisation"><span data-t="organisation"></span> <span class="req" aria-hidden="true">*</span></label>
                    <input type="text" id="organisation" name="organisation" autocomplete="organization" required>
                </div>
                <div class="ega-row">
                    <div class="ega-field">
                        <label for="country"><span data-t="country"></span> <span class="req" aria-hidden="true">*</span></label>
                        <input type="text" id="country" name="country" autocomplete="country-name" required>
                    </div>
                    <div class="ega-field">
                        <label for="region"><span data-t="region"></span> <span class="req" aria-hidden="true">*</span></label>
                        <select id="region" name="region" required></select>
                    </div>
                </div>
                <div class="ega-field">
                    <label for="representative"><span data-t="representative"></span> <span class="req" aria-hidden="true">*</span></label>
                    <input type="text" id="representative" name="representative" autocomplete="name" required>
                </div>
                <div class="ega-field">
                    <label for="email"><span data-t="email"></span> <span class="req" aria-hidden="true">*</span></label>
                    <input type="email" id="email" name="email" autocomplete="email" inputmode="email" required>
                </div>
                <label class="ega-check" id="declaration-wrap" for="declaration">
                    <input type="checkbox" id="declaration" name="declaration" required>
                    <span data-t="declaration"></span>
                </label>
            </section>

            <section class="ega-card" aria-labelledby="h-ballot">
                <h2 id="h-ballot" data-t="ballotTitle"></h2>
                <p class="ega-card__intro" data-t="ballotIntro"></p>
                <div id="amendments"></div>
                <div class="ega-progress" aria-live="polite">
                    <span class="ega-progress__text" id="progress-text"></span>
                    <span class="ega-progress__bar" aria-hidden="true"><span class="ega-progress__fill" id="progress-fill"></span></span>
                </div>
                <div class="ega-field">
                    <label for="comment" data-t="commentLabel"></label>
                    <textarea id="comment" name="comment" maxlength="1000"></textarea>
                    <div class="ega-counter"><span id="comment-count">0</span> / 1000</div>
                </div>
                <button type="submit" class="ega-btn ega-btn--block"><span data-t="reviewBtn"></span></button>
            </section>
        </form>

        <!-- Step 4: review -->
        <section class="ega-card" id="s-review" hidden aria-labelledby="h-review" tabindex="-1">
            <h2 id="h-review" data-t="reviewTitle"></h2>
            <p class="ega-card__intro" data-t="reviewIntro"></p>
            <dl class="ega-dl" id="review-who"></dl>
            <div style="overflow-x:auto;">
                <table class="ega-table">
                    <thead><tr><th data-t="thAmendment"></th><th data-t="thTitle"></th><th data-t="thVote"></th><th><span class="sr-only" data-t="thEdit"></span></th></tr></thead>
                    <tbody id="review-rows"></tbody>
                </table>
            </div>
            <div id="review-comment"></div>
            <p class="ega-warning" data-t="finalWarning"></p>
            <div class="ega-msg" id="submit-msg" role="alert"></div>
            <div class="ega-actions">
                <button type="button" class="ega-btn" id="submit-btn"><span data-t="submitBtn"></span></button>
                <button type="button" class="ega-btn ega-btn--outline" id="back-btn"><span data-t="backBtn"></span></button>
            </div>
        </section>

        <!-- Confirmation -->
        <section class="ega-card ega-done" id="s-done" hidden aria-labelledby="h-done" tabindex="-1">
            <div class="ega-done__icon" aria-hidden="true">&#10003;</div>
            <h2 id="h-done" data-t="doneTitle"></h2>
            <p style="margin:0;"><span data-t="receiptLabel"></span></p>
            <div class="ega-receipt" id="done-receipt"></div>
            <dl class="ega-dl" id="done-who" style="max-width:520px; margin:14px auto 0; text-align:left;"></dl>
            <p class="ega-done__text" data-t="doneText"></p>
            <table class="ega-table">
                <thead><tr><th data-t="thAmendment"></th><th data-t="thTitle"></th><th data-t="thVote"></th></tr></thead>
                <tbody id="done-rows"></tbody>
            </table>
            <div class="ega-actions no-print" style="justify-content:center;">
                <button type="button" class="ega-btn" id="print-btn"><span data-t="printBtn"></span></button>
            </div>
        </section>
    </main>

    <footer>
        <div class="wrap">
            <p>&copy; 2026 African Organic Network (AfrONet)</p>
            <p><span data-t="help"></span> <a href="mailto:info@afronet.bio">info@afronet.bio</a></p>
        </div>
    </footer>

    <script>
        (function () {
            "use strict";
            var API = "https://script.google.com/macros/s/AKfycbzZD0S5BOSL-yS4l0TQHWWRFKVMi0QukgLcXvF2fGKBWP3UETXvw1AxZqp4JDD3Ly21sA/exec";
            var CHOICES = ["YES", "NO", "ABSTAIN"];

            var S = {
                en: {

                $("declaration-wrap").classList.toggle("is-invalid", !dec.checked);
                if (!dec.checked) problems.push({ id: "declaration", text: t("errDeclaration") });
                ((state.cfg && state.cfg.amendments) || []).forEach(function (a) {
                    var missing = !state.votes[a.id];
                    $("amend-" + a.id).classList.toggle("is-invalid", missing);
                    if (missing) problems.push({ id: "amend-" + a.id, text: t("errVote", { id: a.id }) });
                });
                var box = $("form-errors");
                box.innerHTML = "";
                if (!problems.length) { box.hidden = true; return true; }
                box.appendChild(el("p", "", t("errorsTitle")));
                var ul = el("ul");
                problems.forEach(function (p) {
                    var li = el("li"), a = el("a", "", p.text);
                    a.href = "#" + p.id;
                    a.addEventListener("click", function (e) { e.preventDefault(); goTo(p.id); });
                    li.appendChild(a);
                    ul.appendChild(li);
                });
                box.appendChild(ul);
                box.hidden = false;
                if (focus) goTo(problems[0].id);
                return false;
            }
            function goTo(id) {
                var target = $(id);
                if (!target) return;
                target.scrollIntoView({ behavior: "smooth", block: "center" });
                var focusable = target.matches("input, select, textarea") ? target : target.querySelector("input");
                if (focusable) setTimeout(function () { focusable.focus({ preventScroll: true }); }, 350);
            }
            FIELDS.concat(["declaration"]).forEach(function (f) {
                $(f).addEventListener(f === "declaration" || f === "region" ? "change" : "input", function () {
                    if (!$("form-errors").hidden) validate(false);
                });
            });
            $("s-form").addEventListener("submit", function (e) {
                e.preventDefault();
                if (!validate(true)) return;
                state.view = "review";
                renderReview();
                $("s-code").hidden = true;
                $("s-form").hidden = true;
                $("s-review").hidden = false;
                $("submit-msg").textContent = "";
                $("submit-msg").className = "ega-msg";
                setStep(4);
                window.scrollTo(0, 0);
                $("s-review").focus({ preventScroll: true });
            });

            /* ---------- review ---------- */
            function whoList(target, extra) {
                var dl = $(target);
                dl.innerHTML = "";
                [[t("organisation"), $("organisation").value.trim()], [t("country"), $("country").value.trim()], [t("region"), $("region").value],
                    [t("representative"), $("representative").value.trim()], [t("email"), $("email").value.trim()]].concat(extra || []).forEach(function (p) {
                    dl.appendChild(el("dt", "", p[0]));
                    dl.appendChild(el("dd", "", p[1]));
                });
            }
            function voteRows(tbody, withEdit) {
                var body = $(tbody);
                body.innerHTML = "";
                ((state.cfg && state.cfg.amendments) || []).forEach(function (a) {
                    var tr = el("tr");
                    tr.appendChild(el("td", "", a.id));
                    tr.appendChild(el("td", "", amendTitle(a)));
                    var td = el("td");
                    td.appendChild(el("span", "ega-badge ega-badge--" + state.votes[a.id], t(state.votes[a.id])));
                    tr.appendChild(td);
                    if (withEdit) {
                        var te = el("td"), b = el("button", "ega-linkbtn", t("edit"));
                        b.type = "button";
                        b.setAttribute("aria-label", t("edit") + " " + a.id);
                        b.addEventListener("click", function () { backToForm("amend-" + a.id); });
                        te.appendChild(b);
                        tr.appendChild(te);
                    }
                    body.appendChild(tr);
                });
            }
            function renderReview() {
                whoList("review-who");
                voteRows("review-rows", true);
                var c = $("comment").value.trim(), rc = $("review-comment");
                rc.innerHTML = "";
                if (c) {
                    rc.appendChild(el("p", "ega-label", t("yourComment")));
                    var q = el("p", "", c);
                    q.style.cssText = "margin:0; white-space:pre-wrap; color:var(--muted);";
                    rc.appendChild(q);
                }
            }
            function backToForm(id) {
                state.view = "form";
                $("s-review").hidden = true;
                $("s-code").hidden = false;
                $("s-form").hidden = false;
                updateProgress();
                setStep(3);
                goTo(id || "amendments");
            }
            $("back-btn").addEventListener("click", function () { backToForm(); });

            /* ---------- submit ---------- */
            function setSubmitting(on) {
                var b = $("submit-btn");
                b.disabled = on;
                b.innerHTML = "";
                if (on) b.appendChild(el("span", "ega-spinner"));
                b.appendChild(el("span", "", on ? t("submitting") : t("submitBtn")));
                $("back-btn").disabled = on;
            }
            function showSubmitError(code, retryable) {
                var m = $("submit-msg");
                m.className = "ega-msg " + (retryable ? "ega-msg--warn" : "ega-msg--error");
                m.textContent = errText(code);
                var b = $("submit-btn");
                b.innerHTML = "";
                b.appendChild(el("span", "", retryable ? t("retry") : t("submitBtn")));
                b.hidden = !retryable;
            }
            $("submit-btn").addEventListener("click", function () {
                if (state.inflight || state.submitted) return;
                state.inflight = true;
                setSubmitting(true);
                $("submit-msg").textContent = "";
                $("submit-msg").className = "ega-msg";
                var votes = {};
                ((state.cfg && state.cfg.amendments) || []).forEach(function (a) { votes[a.id] = state.votes[a.id]; });
                var body = {
                    action: "vote",
                    code: state.code,
                    organisation: $("organisation").value.trim(),
                    country: $("country").value.trim(),
                    region: $("region").value,
                    representative: $("representative").value.trim(),
                    email: $("email").value.trim(),
                    declaration: $("declaration").checked,
                    votes: votes,
                    comment: $("comment").value.trim(),
                    lang: state.lang
                };
                request(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) }).then(function (r) {
                    state.inflight = false;
                    if (r && r.ok) {
                        state.submitted = true;
                        state.result = r;
                        state.view = "done";
                        renderDone();
                        $("s-review").hidden = true;
                        $("steps").hidden = true;
                        $("s-done").hidden = false;
                        window.scrollTo(0, 0);
                        $("s-done").focus({ preventScroll: true });
                        return;
                    }
                    setSubmitting(false);
                    var code = (r && r.error) || "SERVER_ERROR";
                    if (code === "INCOMPLETE") {
                        backToForm();
                        validate(false);
                        (r.fields || []).forEach(function (f) {
                            var target = $(f) || $("amend-" + f);
                            if (target) target.classList.add("is-invalid");
                        });
                        var first = (r.fields || [])[0];
                        if (first) goTo($(first) ? first : "amend-" + first);
                        var box = $("form-errors");
                        box.hidden = false;
                        if (!box.firstChild) box.appendChild(el("p", "", errText("INCOMPLETE")));
                        return;
                    }
                    var retryable = code === "BUSY_TRY_AGAIN" || code === "SERVER_ERROR" || code === "BAD_REQUEST";
                    showSubmitError(code, retryable);
                    if (!retryable) { $("back-btn").hidden = true; }
                }).catch(function () {
                    state.inflight = false;
                    setSubmitting(false);
                    showSubmitError("NETWORK", true);
                });
            });

            /* ---------- confirmation ---------- */
            function renderDone() {
                var r = state.result;
                if (!r) return;
                $("done-receipt").textContent = r.receipt || "";
                whoList("done-who", [[t("recordedAt"), r.recordedAt || ""]]);
                if (r.organisation) $("done-who").children[1].textContent = r.organisation;
                voteRows("done-rows", false);
            }
            $("print-btn").addEventListener("click", function () { window.print(); });

            window.addEventListener("beforeunload", function (e) {
                if (state.verified && !state.submitted && Object.keys(state.votes).length) {
                    e.preventDefault();
                    e.returnValue = t("leaveWarning");
                    return e.returnValue;
                }
            });

            applyLang();
            loadConfig();
        })();
    </script>
</body>

</html>
